name: RideLink CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'integration/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test All Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Account Service (Member 1 - IT24102723)
        run: mvn clean test -pl account-service

      - name: Build and Test Driver & Vehicle Service (Member 2 - IT24102468)
        run: mvn test -pl driver-vehicle-service

      - name: Build and Test Ride Management Service (Member 3 - IT24102566)
        run: mvn test -pl ride-management-service

      - name: Build and Test Fare & Payment Service (Member 4 - IT24102758)
        run: mvn test -pl fare-payment-service

      - name: Package All Spring Boot Microservices
        run: mvn clean package -DskipTests
