server:
  port: 8083

spring:
  application:
    name: ride-management-service
  datasource:
    url: jdbc:h2:mem:ridelink_ride_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

services:
  driver-service:
    url: ${DRIVER_SERVICE_URL:http://localhost:8082}
  fare-service:
    url: ${FARE_SERVICE_URL:http://localhost:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
